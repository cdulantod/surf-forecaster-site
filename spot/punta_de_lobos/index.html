const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function deriveKey(user, password, p) {
  const base = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(user + "\n" + password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(p.salt), iterations: p.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function decryptWith(key, p) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(p.iv) }, key, b64(p.data));
  return new TextDecoder().decode(plain);
}
/*DECRYPT-END*/

const STORE = "surf-forecast-key-" + p.salt;
const show = (html) => { document.open(); document.write(html); document.close(); };
const toB64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));

async function tryStored() {
  const saved = sessionStorage.getItem(STORE) || localStorage.getItem(STORE);
  if (!saved) return false;
  try {
    const key = await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", true, ["decrypt"]);
    show(await decryptWith(key, p));
    return true;
  } catch (e) {
    sessionStorage.removeItem(STORE); localStorage.removeItem(STORE);
    return false;
  }
}

document.getElementById("login").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const error = document.getElementById("error");
  error.textContent = "Verificando…";
  try {
    const key = await deriveKey(document.getElementById("user").value, document.getElementById("password").value, p);
    const html = await decryptWith(key, p);
    const raw = toB64(await crypto.subtle.exportKey("raw", key));
    sessionStorage.setItem(STORE, raw);
    if (document.getElementById("remember").checked) localStorage.setItem(STORE, raw);
    show(html);
  } catch (e) {
    error.textContent = "Usuario o contraseña incorrectos.";
  }
});

tryStored();
